const MODULE_INFO = {
  1: { name: "📊 数据汇报", en: "Data Reporting" },
  2: { name: "💬 会议沟通", en: "Meeting & Communication" },
  3: { name: "🧠 逻辑表达", en: "Logic & Analysis" },
  4: { name: "🏢 运营商务", en: "Operations & Business" },
  5: { name: "👂 听力高频", en: "Listening Keywords" },
  6: { name: "🎤 演讲句型", en: "Speaking Templates" }
};

const STORAGE_KEY = 'vocab_anki_v1';
let ankiState = {};
let ankiQueue = [];
let ankiCurrentIdx = 0;
let ankiShowBack = false;
let activeFilter = 'all';

function loadState() {
  try { ankiState = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { ankiState = {}; }
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(ankiState));
}
function getDueCount() {
  const now = Date.now();
  return VOCAB.filter(v => {
    const s = ankiState[v.id];
    if (!s) return true;
    return now >= s.nextReview;
  }).length;
}

function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? '' : 'dark');
  document.getElementById('themeBtn').textContent = isDark ? '🌙 深色' : '☀️ 浅色';
}

// Build tabs
function buildTabs() {
  const bar = document.getElementById('tabBar');
  const dueCount = getDueCount();
  let html = '';
  for (let m = 1; m <= 6; m++) {
    html += `<button class="tab ${m===1?'active':''}" data-panel="m${m}" onclick="switchTab('m${m}')">${MODULE_INFO[m].name}</button>`;
  }
  html += `<button class="tab" data-panel="anki" onclick="switchTab('anki')">🃏 Anki复习 ${dueCount>0?`<span class="review-badge">${dueCount}</span>`:''}</button>`;
  bar.innerHTML = html;
}

function buildPanels() {
  const container = document.getElementById('panels');
  let html = '';
  for (let m = 1; m <= 6; m++) {
    const words = VOCAB.filter(v => v.module === m);
    html += `<div id="panel-m${m}" class="panel ${m===1?'active':''}">`;
    html += `<div class="legend">
      <span style="font-size:13px;font-weight:600;color:var(--text);margin-right:4px;">${MODULE_INFO[m].name}</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--accent)"></span>高频</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--primary)"></span>普通</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--text-light)"></span>补充</span>
      <span style="margin-left:auto;font-size:12px;color:var(--text-muted)">${words.length} 个词</span>
    </div>`;
    html += `<div class="filter-bar">
      <button class="filter-btn active" onclick="filterCards(${m}, 'all', this)">全部</button>
      <button class="filter-btn" onclick="filterCards(${m}, '1', this)">⭐ 高频</button>
      <button class="filter-btn" onclick="filterCards(${m}, '2', this)">普通</button>
      <button class="filter-btn" onclick="filterCards(${m}, 'due', this)">📅 待复习</button>
    </div>`;
    html += `<div class="vocab-grid" id="grid-m${m}">`;
    html += words.map(v => buildCard(v)).join('');
    html += `</div></div>`;
  }
  container.innerHTML = html;
}

function buildCard(v) {
  const now = Date.now();
  const s = ankiState[v.id];
  const isDue = !s || now >= s.nextReview;
  return `<div class="vocab-card priority-${v.priority}" data-module="${v.module}" data-priority="${v.priority}" data-due="${isDue}">
    ${isDue ? '<div style="position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--accent)"></div>' : ''}
    <div class="card-en">${escHtml(v.en)}</div>
    <div class="card-zh">${escHtml(v.zh)}</div>
    <div class="card-ex">${escHtml(v.example)}</div>
    <span class="card-tag">${MODULE_INFO[v.module].en}</span>
  </div>`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function filterCards(moduleNum, type, btn) {
  document.querySelectorAll(`#panel-m${moduleNum} .filter-btn`).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const grid = document.getElementById(`grid-m${moduleNum}`);
  const now = Date.now();
  const filtered = VOCAB.filter(v => {
    if (v.module !== moduleNum) return false;
    if (type === 'all') return true;
    if (type === '1') return v.priority === 1;
    if (type === '2') return v.priority === 2;
    if (type === 'due') {
      const s = ankiState[v.id];
      return !s || now >= s.nextReview;
    }
    return true;
  });
  grid.innerHTML = filtered.map(v => buildCard(v)).join('');
}

function switchTab(panelId) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => { p.style.display='none'; p.classList.remove('active'); });
  document.getElementById('anki-panel').style.display = 'none';
  const activeTab = document.querySelector(`.tab[data-panel="${panelId}"]`);
  if (activeTab) activeTab.classList.add('active');
  if (panelId === 'anki') {
    document.getElementById('anki-panel').style.display = 'block';
    renderAnkiHome();
  } else {
    const panel = document.getElementById(`panel-${panelId}`);
    if (panel) { panel.style.display = 'block'; panel.classList.add('active'); }
  }
}

// ANKI
function getAnkiQueue() {
  const now = Date.now();
  return VOCAB.filter(v => {
    const s = ankiState[v.id];
    return !s || now >= s.nextReview;
  }).sort(() => Math.random() - 0.5);
}

function renderAnkiHome() {
  const queue = getAnkiQueue();
  const total = VOCAB.length;
  const known = Object.values(ankiState).filter(s => s.rating === 3).length;
  const reviewed = Object.keys(ankiState).length;
  const content = document.getElementById('ankiContent');
  if (queue.length === 0) {
    content.innerHTML = `<div class="anki-empty">
      <div class="big">🎉</div>
      <div style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px;">今日复习全部完成！</div>
      <div>明天还有 ${Object.values(ankiState).filter(s => {const d=new Date(s.nextReview); return d.toDateString()===new Date(Date.now()+86400000).toDateString();}).length} 个词等着你</div>
      <div class="anki-stats-grid">
        <div class="anki-stat-card"><div class="big-num">${total}</div><div class="slabel">总词数</div></div>
        <div class="anki-stat-card"><div class="big-num">${reviewed}</div><div class="slabel">已复习</div></div>
        <div class="anki-stat-card"><div class="big-num">${known}</div><div class="slabel">已掌握</div></div>
      </div>
    </div>`;
  } else {
    content.innerHTML = `<div style="margin-bottom:16px;">
      <div style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px;">今日待复习</div>
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">共 <strong style="color:var(--primary)">${queue.length}</strong> 个词，已掌握 ${known}/${total}</div>
      <div class="anki-stats-grid">
        <div class="anki-stat-card"><div class="big-num">${queue.length}</div><div class="slabel">待复习</div></div>
        <div class="anki-stat-card"><div class="big-num">${total - reviewed}</div><div class="slabel">未学习</div></div>
        <div class="anki-stat-card"><div class="big-num">${known}</div><div class="slabel">已掌握</div></div>
      </div>
      <div style="text-align:center;margin-top:20px;">
        <button class="anki-start-btn" onclick="startAnki()">🚀 开始复习</button>
      </div>
    </div>`;
  }
}

function startAnki() {
  ankiQueue = getAnkiQueue();
  ankiCurrentIdx = 0;
  ankiShowBack = false;
  renderAnkiCard();
}

function renderAnkiCard() {
  const content = document.getElementById('ankiContent');
  if (ankiCurrentIdx >= ankiQueue.length) {
    saveState();
    buildTabs(); // refresh badge
    renderAnkiHome();
    return;
  }
  const v = ankiQueue[ankiCurrentIdx];
  const progress = ankiCurrentIdx / ankiQueue.length * 100;
  const s = ankiState[v.id];
  const scene = MODULE_INFO[v.module].en;
  let html = `<div>
    <div class="anki-info"><span>${ankiCurrentIdx + 1} / ${ankiQueue.length}</span><span>${MODULE_INFO[v.module].name}</span></div>
    <div class="anki-progress-bar"><div class="anki-progress-fill" style="width:${progress}%"></div></div>
    <div class="anki-card-wrap" onclick="flipCard()">
      <div class="anki-card">`;
  if (!ankiShowBack) {
    html += `<div class="anki-label">中文 → 英文</div>
      <div class="anki-zh">${escHtml(v.zh)}</div>
      <div class="anki-scene">📌 场景：${escHtml(scene)}</div>
      <div class="anki-tap">点击翻牌 👆</div>`;
  } else {
    html += `<div class="anki-label">英文</div>
      <div class="anki-en">${escHtml(v.en)}</div>
      <div class="anki-ex">"${escHtml(v.example)}"</div>`;
  }
  html += `</div></div>`;
  if (ankiShowBack) {
    html += `<div class="anki-btns">
      <button class="anki-btn btn-forgot" onclick="rateCard(1)">❌ 忘了<br><small>明天再看</small></button>
      <button class="anki-btn btn-fuzzy" onclick="rateCard(2)">🤔 模糊<br><small>3天后</small></button>
      <button class="anki-btn btn-know" onclick="rateCard(3)">✅ 记住<br><small>7天后</small></button>
    </div>`;
  }
  html += `</div>`;
  content.innerHTML = html;
}

function flipCard() {
  if (!ankiShowBack) {
    ankiShowBack = true;
    renderAnkiCard();
  }
}

function rateCard(rating) {
  const v = ankiQueue[ankiCurrentIdx];
  const intervals = { 1: 1, 2: 3, 3: 7 };
  const days = intervals[rating];
  ankiState[v.id] = {
    rating,
    nextReview: Date.now() + days * 86400000,
    lastReviewed: Date.now()
  };
  saveState();
  ankiCurrentIdx++;
  ankiShowBack = false;
  renderAnkiCard();
}

// Init
loadState();
buildTabs();
buildPanels();
</script>
</body>
</html>
